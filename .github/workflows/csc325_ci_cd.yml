name: CI/CD Pipeline for CSC325 Django Project

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Stage 1 - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check

  test:
    name: Stage 2 - Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test

  migrations:
    name: Stage 3 - Migration check
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run

  deploy:
    name: Stage 4 - Deploy (demo)
    needs: [test, migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Simulate deployment
        run: echo "Deploy stage complete (demo only; no public app URL configured)."